version: '3.9'
name: la-ruche

# =============================================================================
# La Ruche — docker-compose.yml (Production one-click)
# =============================================================================
# Usage :
#   docker compose up -d          # Tout démarrer
#   docker compose down           # Tout arrêter
#   docker compose logs -f        # Logs en direct
#
# Variables d'env : copiez .env.example → .env et remplissez les valeurs.
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: ruche-redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  chromadb:
    image: chromadb/chroma:latest
    container_name: ruche-chroma
    ports: ["8000:8000"]
    volumes: [chroma_data:/chroma/chroma]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  queen:
    build:
      context: .
      dockerfile: apps/queen/Dockerfile
    container_name: ruche-queen
    ports: ["3000:3000", "9002:9002"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - AGENT_ORCHESTRATION_URL=http://ruche-agents:8001
      - AGENT_PERCEPTION_URL=http://ruche-agents:8002
      - AGENT_BRAIN_URL=http://ruche-agents:8003
      - AGENT_EXECUTOR_URL=http://ruche-agents:8004
      - AGENT_EVOLUTION_URL=http://ruche-agents:8005
      - AGENT_MEMORY_URL=http://ruche-agents:8006
      - AGENT_MCP_BRIDGE_URL=http://ruche-agents:8007
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes: [./apps/queen/data:/app/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: ruche-dashboard
    ports: ["3001:3001"]
    environment:
      - NEXT_PUBLIC_QUEEN_URL=http://localhost:3000
      - NEXT_PUBLIC_WS_URL=ws://localhost:9002
    depends_on:
      queen:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  agents:
    build:
      context: .
      dockerfile: agents/Dockerfile.agent
    container_name: ruche-agents
    ports:
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
      - "8004:8004"
      - "8005:8005"
      - "8006:8006"
      - "8007:8007"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - REDIS_URL=redis://redis:6379
      - CHROMA_HOST=ruche-chroma
      - CHROMADB_HOST=ruche-chroma
      - CHROMADB_PORT=8000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - agent_data:/app/data
      - ./agents:/app/agents

volumes:
  redis_data:
    name: ruche-redis-data
  chroma_data:
    name: ruche-chroma-data
  agent_data:
    name: ruche-agent-data
